<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Intro Animation FINI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--red:#e50914}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#000;overflow:hidden;font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;color:#fff}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#logo{height:62vmin;aspect-ratio:3/4;filter:drop-shadow(0 0 22px rgba(229,9,20,.55));will-change:transform,opacity}
#logo svg{width:100%;height:100%;overflow:visible}

.part{transform-box:fill-box;}
.part.p1 { transform-origin: 50% 0; transform: scaleY(0); }
.part.p2, .part.p3 { transform-origin: 0 50%; transform: scaleX(0); }

.play .p1{animation:growY .7s cubic-bezier(.6,0,.3,1) .1s forwards}
.play .p2{animation:growX .7s cubic-bezier(.6,0,.3,1) .5s forwards}
.play .p3{animation:growX .7s cubic-bezier(.6,0,.3,1) .9s forwards}

@keyframes growY{to{transform:scaleY(1)}}
@keyframes growX{to{transform:scaleX(1)}}

#fur{opacity:0}
.play #fur{animation:fade .6s ease 1.7s forwards}
@keyframes fade{to{opacity:1}}
.fur{transform-box:fill-box;transform-origin:50% 50%}
.fr{animation:lumR 2.2s ease-in-out infinite alternate}
.fl{animation:lumL 2.2s ease-in-out infinite alternate}
@keyframes lumR{0%{transform:translateX(0)}40%{transform:translateX(-10px) scaleX(1)}50%{transform:translateX(-60px)}100%{transform:translateX(-120px) scaleX(3)}}
@keyframes lumL{0%{transform:translateX(0)}40%{transform:translateX(10px) scaleX(1)}50%{transform:translateX(60px)}100%{transform:translateX(120px) scaleX(3)}}

.play #logo{animation:zoom 1.3s cubic-bezier(.6,0,.9,.4) 3.4s forwards}
@keyframes zoom{0%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(16);opacity:0}}

#burst{position:fixed;inset:0;display:flex;pointer-events:none;mix-blend-mode:screen}
#burst i{flex:1;opacity:0;transform:scaleY(0);filter:blur(1px)}
.play #burst i{animation:burst 1.5s ease-out forwards}
@keyframes burst{0%{opacity:0;transform:scaleY(0)}30%{opacity:.95;transform:scaleY(1)}100%{opacity:0;transform:scaleY(1.1)}}

#word{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(48px,15vw,170px);letter-spacing:.05em;color:var(--red);opacity:0;text-shadow:0 0 40px rgba(229,9,20,.6)}
.play #word{animation:word 1.6s ease 4.6s forwards}
@keyframes word{from{opacity:0;letter-spacing:-.05em;filter:blur(12px)}to{opacity:1;letter-spacing:.12em;filter:blur(0)}}

#replay{position:fixed;left:50%;bottom:max(28px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--red);color:#fff;border:0;border-radius:6px;padding:10px 28px;font:inherit;font-size:22px;letter-spacing:.08em;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s,filter .2s; z-index:100}
#replay.show{opacity:1;pointer-events:auto}
#replay:hover{filter:brightness(1.15)}
</style>
</head>
<body>
<div id="stage">
  <div id="logo">
    <svg viewBox="0 0 300 400" aria-label="F">
      <defs>
        <linearGradient id="side" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a050c"/><stop offset="1" stop-color="#b1060f"/></linearGradient>
        <linearGradient id="diag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e50914"/><stop offset="1" stop-color="#9b0610"/></linearGradient>
        <clipPath id="fclip">
          <rect x="40" y="20" width="60" height="360"/>
          <rect x="40" y="20" width="220" height="60"/>
          <rect x="40" y="160" width="160" height="60"/>
        </clipPath>
      </defs>
      <!-- Barra vertical -->
      <rect class="part p1" x="40" y="20" width="60" height="360" fill="url(#side)"/>
      <!-- Barra superior -->
      <rect class="part p2" x="40" y="20" width="220" height="60" fill="url(#diag)"/>
      <!-- Barra media -->
      <rect class="part p3" x="40" y="160" width="160" height="60" fill="url(#diag)"/>
      <g id="fur" clip-path="url(#fclip)"></g>
    </svg>
  </div>
</div>
<div id="burst"></div>
<div id="word">F.I.N.I.</div>
<button id="replay">Repetir</button>
<script>
const root=document.body,fur=document.getElementById('fur'),burst=document.getElementById('burst'),btn=document.getElementById('replay');
const NS='http://www.w3.org/2000/svg',pal=['#ff1a1a','#ff5a1f','#ff2d95','#e50914','#ffb300','#3a4cff','#b1060f'];
const r=(a,b)=>a+Math.random()*(b-a);
for(let i=0;i<31;i++){
  const e=document.createElementNS(NS,'rect');
  e.setAttribute('class','fur '+(i%2?'fr':'fl'));
  e.setAttribute('x',r(0,300));e.setAttribute('y',0);
  e.setAttribute('width',r(3,12));e.setAttribute('height',400);
  e.setAttribute('fill',pal[Math.floor(r(0,pal.length))]);
  e.setAttribute('opacity',r(.35,.9));
  e.style.animationDelay=(-r(0,2.2))+'s';
  e.style.animationDuration=r(1.6,3)+'s';
  fur.appendChild(e);
}
const n=48;
for(let i=0;i<n;i++){
  const b=document.createElement('i'),c1=pal[Math.floor(r(0,pal.length))],c2=pal[Math.floor(r(0,pal.length))];
  b.style.background=`linear-gradient(${c1},${c2} 50%,${c1})`;
  b.style.animationDelay=(3.5+Math.abs(i-n/2)/n*.9+r(0,.25))+'s';
  burst.appendChild(b);
}
let t;
function play(){
  clearTimeout(t);btn.classList.remove('show');
  root.classList.remove('play');void root.offsetWidth;root.classList.add('play');
  t=setTimeout(()=>btn.classList.add('show'),6600);
}
btn.addEventListener('click',play);
play();
</script>
</body>
</html>
